name: careerhq
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careerhq
      POSTGRES_PASSWORD: careerhq
      POSTGRES_DB: careerhq
    ports: ["${CAREERHQ_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerhq"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  # Fictional ATS used as the e2e target and only auto-apply destination for
  # demos (spec P5). No dependencies, present by default (not behind a
  # profile) since the e2e suite needs it the same way it needs mailpit.
  demo-ats:
    build: { context: .., dockerfile: infra/Dockerfile.demo-ats }
    ports: ["3001:3001"]
  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      DATABASE_URL: postgres://careerhq:careerhq@postgres:5432/careerhq
      # Must match the volume mount below; web and worker share one file tree.
      FILE_STORAGE_DIR: /app/var/files
      # AI materials-generation knobs. The images carry no .env, so without
      # these the web service is permanently ai_unavailable. All optional:
      # empty/unset passes through to the config defaults.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_FAST_MODELS: ${AI_FAST_MODELS:-}
      AI_WRITING_MODELS: ${AI_WRITING_MODELS:-}
      AI_MODE: ${AI_MODE:-live}
      AI_REPLAY_DIR: ${AI_REPLAY_DIR:-}
      # Credential encryption key (packages/db/src/crypto.ts). Unset disables
      # email connections; see .env.example for how to generate one.
      CAREERHQ_MASTER_KEY: ${CAREERHQ_MASTER_KEY:-}
      # Submission gates (spec §11). Both default OFF: a container that is
      # never told otherwise cannot send a real application email. The sandbox
      # allow-list names the mailpit service on this network.
      SUBMISSIONS_LIVE_EMAIL: ${SUBMISSIONS_LIVE_EMAIL:-false}
      SANDBOX_SMTP_ALLOWED_HOST: ${SANDBOX_SMTP_ALLOWED_HOST:-mailpit}
      # Fictional ATS target for auto-apply demos (spec P5). The web app only
      # links to it; the worker is what drives a browser against it.
      DEMO_ATS_URL: ${DEMO_ATS_URL:-http://demo-ats:3001}
      AUTOAPPLY_BROWSER_TIMEOUT_MS: ${AUTOAPPLY_BROWSER_TIMEOUT_MS:-45000}
    ports: ["3000:3000"]
    volumes: [files:/app/var/files]
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    environment:
      DATABASE_URL: postgres://careerhq:careerhq@postgres:5432/careerhq
      FILE_STORAGE_DIR: /app/var/files
      # Discovery/AI knobs. The images carry no .env, so without these the
      # worker can never re-rank (skipped_no_key) and INGEST_CRON is fixed.
      # All optional: empty passes through to the config defaults.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_FAST_MODELS: ${AI_FAST_MODELS:-}
      INGEST_CRON: ${INGEST_CRON:-0 */6 * * *}
      # Cron for the IMAP poll that links replies to applications (email.sync).
      EMAIL_SYNC_CRON: ${EMAIL_SYNC_CRON:-*/15 * * * *}
      # Credential encryption key (packages/db/src/crypto.ts). Unset disables
      # email connections; see .env.example for how to generate one.
      CAREERHQ_MASTER_KEY: ${CAREERHQ_MASTER_KEY:-}
      # Same gates as web: the worker shares the config schema, and follow-up
      # automation must never outrun the environment's send permission.
      SUBMISSIONS_LIVE_EMAIL: ${SUBMISSIONS_LIVE_EMAIL:-false}
      SANDBOX_SMTP_ALLOWED_HOST: ${SANDBOX_SMTP_ALLOWED_HOST:-mailpit}
      # Auto-apply (spec P5): the fictional ATS the Playwright driver targets,
      # and the driver's per-action budget (navigation, one field, the submit
      # wait) — not the budget for a whole attempt.
      DEMO_ATS_URL: ${DEMO_ATS_URL:-http://demo-ats:3001}
      AUTOAPPLY_BROWSER_TIMEOUT_MS: ${AUTOAPPLY_BROWSER_TIMEOUT_MS:-45000}
    volumes: [files:/app/var/files]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
  files:
