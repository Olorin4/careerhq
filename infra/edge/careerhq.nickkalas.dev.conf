# careerhq.nickkalas.dev → careerhq-web:3000 (this repo, on the shared `edge` net)
#
# Committed here rather than in the kelevoTMS repo that owns the edge stack:
# that repo's SETUP.md assembles ~/infra/edge/conf.d/ with
# `cp ~/infra/staging/conf.d/*.conf ~/infra/edge/conf.d/`, which is an additive
# copy, so a file placed alongside survives every edge redeploy. Deploy step:
#
#   cp infra/edge/careerhq.nickkalas.dev.conf ~/infra/edge/conf.d/
#   docker exec edge-nginx nginx -t && docker exec edge-nginx nginx -s reload
#
# `nginx -t` MUST pass before the reload: this proxy also fronts the owner's
# other production sites, and a broken reload takes all of them down.
#
# TLS: a SELF-SIGNED origin certificate, with this zone's Cloudflare SSL/TLS mode
# set to **Full**, not Full (strict). That differs deliberately from every other
# vhost here, which uses a real Cloudflare Origin Certificate under Full (strict).
# Minting an Origin Cert needs an Origin CA key the demo's owner did not want to
# provision for a throwaway portfolio demo, and SSL/TLS mode is per-zone —
# `nickkalas.dev` is a separate zone from kelevo.ai, getkelevo.com and
# iron-wing.com, so relaxing it here cannot weaken any of those. Traffic between
# Cloudflare and this origin is still encrypted; it is the origin's identity that
# is unverified, and the only thing behind it is fictional demo data.
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout ~/infra/edge/certs/careerhq-selfsigned.key \
#     -out    ~/infra/edge/certs/careerhq-selfsigned.pem \
#     -subj "/CN=careerhq.nickkalas.dev"
#   chmod 600 ~/infra/edge/certs/careerhq-selfsigned.key
#
# Both files are gitignored and box-only, like the other origin certs.

server {
    listen 80;
    listen [::]:80;
    server_name careerhq.nickkalas.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name careerhq.nickkalas.dev;

    ssl_certificate     /etc/nginx/certs/careerhq-selfsigned.pem;
    ssl_certificate_key /etc/nginx/certs/careerhq-selfsigned.key;

    # CV upload. The app's own cap is 2 MB per file in demo mode and the Next
    # server action body limit is 6 MB; 8 MB here keeps nginx from being the
    # thing that rejects, so an oversized upload gets the app's rendered
    # message instead of a bare 413 page.
    client_max_body_size 8m;

    location / {
        proxy_pass http://careerhq-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Grounded generation streams over SSE (apps/web/src/app/api/generate/
        # stream). Buffering here would hold the whole response and the draft
        # would appear in one lump instead of token by token.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
